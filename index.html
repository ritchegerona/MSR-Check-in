<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MSR Check-in - Secure check-in for office visitors">
  <title>MSR Check-in</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Animated Background Decorations -->
  <div class="bg-decoration bg-decoration--1" aria-hidden="true"></div>
  <div class="bg-decoration bg-decoration--2" aria-hidden="true"></div>
  <div class="bg-decoration bg-decoration--3" aria-hidden="true"></div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- Chooser Modal -->
  <div id="chooserModal" class="modal hidden">
    <div class="modal-content">
      <h3 style="margin-bottom: 20px; color: var(--text-primary);">Who are you?</h3>
      <div style="display: flex; flex-direction: column; gap: 12px;">
<button class="btn-submit" id="visitorsBtn" style="width: 100%; justify-content: center;">
  Visitor
</button>
<button class="btn-submit" id="employeeBtn" style="width: 100%; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--secondary));">
  MSR Employee
</button>
      </div>
    </div>
  </div>

<!-- Employee Form Modal -->
<div id="employeeModal" class="modal hidden">
<div class="modal-content">
<h3 style="margin-bottom: 20px; color: var(--text-primary);" id="employeeModalTitle">Employee Check-in</h3>
<form id="employeeForm" novalidate autocomplete="off">
<div class="form-group">
<label class="form-label" for="employeeName">Full Name</label>
<div class="select-wrapper">
<select id="employeeName" class="form-select" required aria-describedby="employeeNameError">
<option value="">Select employee name...</option>
</select>
</div>
<div class="error-message" id="employeeNameError" role="alert"></div>
</div>

<div class="form-group">
<label class="form-label" for="employeeDept">Department</label>
<div class="select-wrapper">
<select id="employeeDept" class="form-select" required aria-describedby="employeeDeptError">
<option value="">Select department...</option>
</select>
</div>
<div class="error-message" id="employeeDeptError" role="alert"></div>
</div>

<button type="submit" id="employeeSubmitBtn" class="btn-submit" style="margin-top: 8px;">
<span class="spinner"></span>
<span class="btn-text">Check In</span>
</button>
</form>
</div>
</div>
</div>
<!-- Employee Success Modal -->
<div id="employeeSuccessModal" class="modal hidden">
  <div class="modal-content">
    <h3 style="margin-bottom: 16px; color: var(--text-primary);">Success</h3>
    <p id="employeeSuccessMessage" style="margin-bottom: 24px; color: var(--text-secondary); font-size: 15px;"></p>
    <div id="employeeSuccessBtnContainer" class="hidden" style="display: flex; flex-direction: column; gap: 12px;">
      <button id="employeeBackBtn" class="btn-submit" style="background: linear-gradient(135deg, var(--primary), var(--secondary));">
        <span class="btn-text">Back to Dashboard</span>
      </button>
      <button id="employeeCloseBtn" class="btn-submit" style="background: #6c757d;">
        <span class="btn-text">Close</span>
      </button>
    </div>
  </div>
</div>
<!-- Visitor Success Modal -->
<div id="visitorSuccessModal" class="modal hidden">
  <div class="modal-content">
    <h3 style="margin-bottom: 16px; color: var(--text-primary);">Success</h3>
    <p id="visitorSuccessMessage" style="margin-bottom: 24px; color: var(--text-secondary); font-size: 15px;"></p>
    <div id="visitorSuccessBtnContainer" class="hidden" style="display: flex; flex-direction: column; gap: 12px;">
      <button id="visitorBackBtn" class="btn-submit" style="background: linear-gradient(135deg, var(--primary), var(--secondary));">
        <span class="btn-text">Back to Dashboard</span>
      </button>
      <button id="visitorCloseBtn" class="btn-submit" style="background: #6c757d;">
        <span class="btn-text">Close</span>
      </button>
    </div>
  </div>
</div>
  <!-- Main Container (hidden until choice) -->
  <div id="mainContainer" class="container hidden">

    <!-- Check-in Card -->
    <div class="card">

      <!-- Header -->
      <header class="header">
        <div class="logo-icon" aria-hidden="true">
          <img src="images/MSR_logo.png" alt="Company Logo" class="logo-img">
        </div>
        <h1>Visitors Check-in</h1>
        <p>Sign in to your visit</p>
      </header>

      <!-- Check-in Form -->
      <form id="checkinForm" novalidate autocomplete="off">

        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            class="form-input"
            placeholder="Enter your full name"
            required
            autocomplete="name"
            aria-describedby="fullNameError"
          >
          <div class="error-message" id="fullNameError" role="alert"></div>
        </div>

        <!-- Contact Number -->
        <div class="form-group">
          <label class="form-label" for="contactNumber">Contact Number</label>
          <input
            type="tel"
            id="contactNumber"
            class="form-input"
            placeholder="09XX XXX XXXX"
            required
            autocomplete="tel"
            aria-describedby="contactError"
          >
          <div class="error-message" id="contactError" role="alert"></div>
        </div>

        <!-- Contact Person -->
        <div class="form-group">
          <label class="form-label" for="contactPerson">Contact Person</label>
          <div class="select-wrapper">
            <select
              id="contactPerson"
              class="form-select"
              required
              aria-describedby="personError"
            >
              <option value="">Select person to visit...</option>
            </select>
          </div>
          <div class="error-message" id="personError" role="alert"></div>
        </div>

        <!-- Purpose of Visit -->
        <div class="form-group">
          <label class="form-label" for="purpose">Purpose of Visit</label>
          <div class="select-wrapper">
            <select
              id="purpose"
              class="form-select"
              required
              aria-describedby="purposeError"
            >
              <option value="">Select purpose of visit...</option>
            </select>
          </div>
          <div class="error-message" id="purposeError" role="alert"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <span class="spinner"></span>
          <span class="btn-text">Submit Check-in</span>
        </button>

      </form>

      <!-- Admin Login -->
      <button id="adminBtn" class="admin-link" aria-label="Admin Login">
        🔧 Admin Login
      </button>

    </div>

    <!-- Footer -->
    <footer class="footer">
      Powered by MSR Check-in &middot; v1.0<br>
      <em>Developed by Ritche Gerona</em>
    </footer>

  </div>

  <!-- Scripts -->
  <script src="js/app.js"></script>

</body>
</html>
